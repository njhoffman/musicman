---
# Default delimiter for CSV output and field separation
delimiter: ","

# Playlist generation settings
playlist:
  # Default filename for generated playlists
  outputPath: default.m3u
  # Directory where playlists are saved (relative to user home or absolute path)
  outputDirectory: ".mpd/playlists/"

# MPD (Music Player Daemon) connection settings
mpd:
  # Port number for MPD connection
  port: 6600
  # Hostname or IP address of MPD server
  host: localhost
  # Base directory where music files are stored on MPD server
  baseDirectory: "/Music/Sorted"

# Library database settings
db:
  # Database file, defaults to musicman.sqlite in mpd.baseDirectory
  path:
  # Directory for database backups, defaults to .musicman in mpd.baseDirectory
  backupDirectory:
  # How often to back up the database: a number of minutes, hours, days, or weeks
  backupInterval: 1 day
  # Number of backups to keep, older backups are deleted
  backupCount: 7

# Notification daemon settings for desktop notifications
daemon:
  # Display duration for notifications in milliseconds
  duration: 5000
  # Path to notification binary (notify-send on Linux)
  bin: "/usr/bin/notify-send"
  # Notification urgency level (LOW, NORMAL, CRITICAL)
  urgency: LOW
  # Whether to show an icon with notifications
  icon: false
  # Metadata fields to include in notifications
  fields:
  - artist
  - context
  - mood

# Rating system configuration
rating:
  # ID3 tag used for storing ratings (POPM = Popularimeter)
  tag: POPM
  # Email identifier for rating system
  email: Default
  # Maximum rating value (1-5 scale)
  max: 5

# Output formatting and display settings
output:
  # Verbosity level for logging (1=error to 6=trace)
  verbosity: 4
  # Padding around output elements
  padding: 1

# Statistics and filtering configuration
stats:
  # Fields that can contain multiple values (comma-separated)
  multiFields:
  - context
  - mood
  # Predefined filter sets for statistics
  filters:
  - name: All Songs > 4.0
    filter: rating:4.0
  - name: All Songs > 4.5
    filter: rating:4.5
  - name: All Songs > 5.0
    filter: rating:5.0
  - name: Singles > 4.0
    filter: rating:4.0 type:singles
  - name: Total
    filter: rating:5.0

# ID3 tag definitions and display settings
tags:
# Artist name (ID3v2 TPE1)
- id: TPE1
  name: artist
# Song title (ID3v2 TIT2)
- id: TIT2
  name: title
  maxWidth: 30
# Album name (ID3v2 TALB)
- id: TALB
  name: album
  maxWidth: 20
# Genre (ID3v2 TCON)
- id: TCON
  name: genre
# Year (ID3v2.3 TYER, tags.json maps year to the ID3v2.4 TDRL frame)
- id: TYER
  name: year

# Music library settings
library:
  # ID3 tag version to use for metadata
  tagId: ID3v2.3
  # Base path for music library scanning
  basePath: "/home/nicholas/Music"
  # Tags that are read, edited, filtered, and displayed - essential for playlists and basic info
  # Only text (T***) and custom (TXXX.*) frames are supported, rating is configured separately
  tags:
  - artist
  - title
  - year
  - genre
  - album
  - album_artist

# View configurations for each output format, tags are displayed in the order listed
# and must be included in library.tags (rating is always available)
views:
  # Table format, used when viewing multiple files
  table:
    headers:
      # Whether to show column headers
      visible: true
      # Whether to capitalize header text
      capitalize: false
    seperators:
      # Whether to show vertical separators between columns
      vertical: false
      # Whether to show horizontal separators between rows
      horizontal: false
    tags:
    - name: rating
    - name: artist
    - name: title
    - name: album
  # List format, used when viewing a single file
  list:
    headers:
      # Whether to show field names in list output
      visible: true
    tags:
    - name: rating
    - name: artist
    - name: album_artist
    - name: title
    - name: album
    - name: genre
    - name: year

# WebSocket server settings for real-time communication
websocket:
  # Port for WebSocket connections
  port: 8999

# HTTP server settings
server:
  # Port for HTTP server
  port: 3000

# Logging configuration
logger:
  # Color schemes for different log levels (hex color codes)
  colors:
    fatal:
      # Foreground color (white)
      fg: '#FFFFFF'
      # Background color (dark red)
      bg: '#E61414'
      # Font styling
      gui: 'italic'
    error:
      fg: '#FFFFFF'
      bg: '#B41414'
      gui: 'normal'
    warn:
      fg: '#FFFFFF'
      bg: '#B43C14'
      gui: 'normal'
    log:
      fg: '#FFFFFF'
      bg: '#3C6EB4'
      gui: 'normal'
    info:
      fg: '#FFFFFF'
      bg: '#143282'
      gui: 'normal'
    debug:
      fg: '#FFFFFF'
      bg: '#5064C8'
      gui: 'normal'
    trace:
      fg: '#FFFFFF'
      bg: '#6496DC'
      gui: 'normal'
  # File logging settings
  file:
    # Log file name
    name: musicman.log
    # Minimum level for file logging (3=warn)
    level: 3
  # Console logging settings
  stdout:
    # Minimum level for console logging (5=debug)
    level: 5

---
# Default delimiter for CSV output and field separation
delimiter: ","

# Playlist generation settings
playlist:
  # Default filename for generated playlists
  outputPath: default.m3u
  # Directory where playlists are saved (relative to user home or absolute path)
  outputDirectory: ".mpd/playlists/"

# MPD (Music Player Daemon) connection settings
mpd:
  # Port number for MPD connection
  port: 6600
  # Hostname or IP address of MPD server
  host: localhost
  # Base directory where music files are stored on MPD server
  baseDirectory: "/Music/Sorted"

# Library database settings
db:
  # Database file, defaults to musicman.sqlite in mpd.baseDirectory
  path:
  # Directory for database backups, defaults to .musicman in mpd.baseDirectory
  backupDirectory:
  # Back up the database before commands that change something, once per backupInterval
  autoBackup: true
  # How often to back up the database: a number of minutes, hours, days, or weeks
  backupInterval: 1 week
  # Number of backups to keep, older backups are deleted
  backupCount: 7

# Changes recorded for musicman undo (tag frames and Spotify adds and removes of each run)
history:
  # Number of runs whose changes are kept, older ones are removed
  keep: 50

# Spotify app credentials; SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, and SPOTIFY_REDIRECT_URI in the
# environment take precedence. Login tokens are stored in $XDG_STATE_HOME/musicman, not here.
spotify:
  clientId:
  clientSecret:
  # Must match a redirect URI registered for the app
  redirectUri: http://127.0.0.1:6659/callback
  # Most Web API requests per second; Spotify bans apps that send too many for hours
  requestsPerSecond: 5
  # Days before the Spotify fields of matched songs (popularity changes) are fetched again
  refreshDays: 30
  # Where sync --match saves the photo of each matched song's first artist (<artist id>.jpg), so they are
  # there offline; defaults to $XDG_CACHE_HOME/musicman/artists
  artistImageDirectory:
  # Spotify fields written to matched songs as custom TXXX.<name> frames, besides TXXX.sp_track_id and
  # TXXX.sp_fetched_at. Each is also a tag with that name, added to library.tags. path starts with
  # track, album (the track's full album), or artist (the track's first artist); [] collects every item
  # of an array. multi stores one value per item, otherwise items are joined with separator (', ').
  # fallback is a tag that gets the value only when the song has none, existing standard tags are never
  # overwritten.
  fields:
  - { path: 'track.name', name: sp_title, fallback: title }
  - { path: 'track.artists[].name', name: sp_artist, fallback: artist }
  - { path: 'track.artists[].id', name: sp_artist_id, multi: true }
  - { path: 'track.album.name', name: sp_album, fallback: album }
  - { path: 'track.album.id', name: sp_album_id }
  - { path: 'track.album.artists[].name', name: sp_album_artist, fallback: album_artist }
  - { path: 'track.album.artists[].id', name: sp_album_artist_id, multi: true }
  - { path: 'track.album.album_type', name: sp_album_type }
  - { path: 'track.album.release_date', name: sp_release_date, fallback: year }
  - { path: 'track.album.total_tracks', name: sp_total_tracks }
  - { path: 'track.track_number', name: sp_track_number, fallback: track }
  - { path: 'track.disc_number', name: sp_disc_number, fallback: disc }
  - { path: 'track.duration_ms', name: sp_duration_ms }
  - { path: 'track.explicit', name: sp_explicit }
  - { path: 'track.popularity', name: sp_popularity }
  - { path: 'track.external_ids.isrc', name: sp_isrc, fallback: isrc_code }
  - { path: 'album.label', name: sp_label, fallback: publisher }
  - { path: 'album.external_ids.upc', name: sp_upc }
  - { path: 'album.copyrights[].text', name: sp_copyright, fallback: copyright, separator: '; ' }
  - { path: 'album.popularity', name: sp_album_popularity }
  - { path: 'album.images[0].url', name: sp_album_image }
  - { path: 'album.genres[]', name: sp_album_genres, multi: true }
  - { path: 'artist.genres[]', name: sp_genres, multi: true }
  - { path: 'artist.popularity', name: sp_artist_popularity }
  - { path: 'artist.followers.total', name: sp_artist_followers }
  - { path: 'artist.images[0].url', name: sp_artist_image }
  # Spotify response paths that are not written and not reported as unassigned. Entries with a dot are
  # paths (and everything under them), others are keys ignored at any depth.
  ignore:
  - available_markets
  - external_urls
  - href
  - images
  - is_local
  - is_playable
  - preview_url
  - release_date_precision
  - restrictions
  - linked_from
  - type
  - uri
  - album.album_type
  - album.artists
  - album.copyrights[].type
  - album.id
  - album.name
  - album.release_date
  - album.total_tracks
  - album.tracks
  - artist.followers.href
  - artist.id
  - artist.name

# Spotify sync settings
sync:
  # Review candidates at least this similar to the song (100 is the same title and length; capitalization,
  # punctuation, and a few seconds are free, up to 20s or a remaster suffix stays above 95, another mix or
  # version falls below) are listed by sync --match and accepted after one confirmation, leaving out any you
  # pick. Empty leaves every probable match for sync --review.
  autoAcceptPercent:
  # Songs rated at least this are added to Spotify Liked Songs
  likedRating: 4.5
  # Only songs matching this filter (view/search syntax, e.g. rating:4.5 or picks:Nick) take part in sync;
  # the others are never matched, pushed, pruned, tagged from Spotify, or downloaded. Empty syncs every song.
  scope:
  # Spotify playlists to keep in sync: songs matching filter (view/search syntax) belong in playlist
  #   - filter: grouping:AlternativeMetal.Artists
  #     playlist: https://open.spotify.com/playlist/5MUDXMSHkjbA2CIYXjj1Vz
  playlists: []
  # Spotify playlist of tracks to leave alone (the menu's ignore button adds to it): sync never lists them to
  # pull or download, and never matches a song to them. Not a sync target, nothing is pushed to it.
  ignorePlaylist:
  # Songs to add to Spotify through the desktop app, defaults to .musicman/upload in mpd.baseDirectory
  uploadDirectory:
  # spotDL downloads, defaults to .musicman/download in mpd.baseDirectory
  downloadDirectory:
  # Command used by the spotDL download script
  spotdlCommand: spotdl
  # beets config, used to find the beets library and its Spotify ids
  beetsConfig: ~/.config/beets/config.yaml

# Backup of the library files with musicman sync --backup: everything in mpd.baseDirectory is mirrored to
# backup.directory. Files only in the backup are moved to <directory>/.musicman-removed/<date>, never deleted.
backup:
  # Backup directory, e.g. a network share; sync --backup needs it set
  directory:
  # Paths left out, relative to mpd.baseDirectory: ** is any path, * any part of a name. The live database
  # is left out because the weekly copies in .musicman are backed up instead.
  exclude:
  - musicman.sqlite*
  - .musicman/download/**
  - .musicman/upload/**

# rofi menu for the playing song (musicman menu), for MPD and Spotify
menu:
  # rofi theme, defaults to the musicman panel theme in cli/share/rofi
  theme:
  # More rofi arguments, e.g. [-theme-str, 'window { width: 900px; }']
  rofiArgs: []
  # Buttons that tag the playing song: filter is one field:value (view/search syntax), label its caption,
  # key the key that presses it, icon an optional glyph. MPD songs and Spotify songs in the library get
  # the tag (Spotify ones are pushed right away); other Spotify songs are added to the sync.playlists
  # entry with the same filter.
  #   - label: Study
  #     filter: context:Study
  #     key: a
  buttons: []
  # Rating buttons, keys 1, 2, 3, ... in order; Spotify songs not in the library go to the sync.playlists
  # entry for that exact rating, e.g. rating:4.5-4.5
  ratings: [4, 4.5, 5]

# Notification daemon settings for desktop notifications
daemon:
  # Display duration for notifications in milliseconds
  duration: 5000
  # Path to notification binary (notify-send on Linux)
  bin: "/usr/bin/notify-send"
  # Notification urgency level (LOW, NORMAL, CRITICAL)
  urgency: LOW
  # Whether to show an icon with notifications
  icon: false
  # Metadata fields to include in notifications
  fields:
  - artist
  - context
  - mood

# Rating system configuration
rating:
  # ID3 tag used for storing ratings (POPM = Popularimeter)
  tag: POPM
  # Email identifier for rating system
  email: Default
  # Maximum rating value (1-5 scale)
  max: 5

# Output formatting and display settings
output:
  # Most detailed log level shown in the terminal: error, warn, info, debug, or trace
  verbosity: info
  # Padding around output elements
  padding: 1

# Statistics and filtering configuration
stats:
  # Fields that can contain multiple values (comma-separated)
  multiFields:
  - context
  - mood
  # Predefined filter sets for statistics
  filters:
  - name: All Songs > 4.0
    filter: rating:4.0
  - name: All Songs > 4.5
    filter: rating:4.5
  - name: All Songs > 5.0
    filter: rating:5.0
  - name: Singles > 4.0
    filter: rating:4.0 type:singles
  - name: Total
    filter: rating:5.0

# ID3 tag definitions and display settings
tags:
# Artist name (ID3v2 TPE1)
- id: TPE1
  name: artist
# Song title (ID3v2 TIT2)
- id: TIT2
  name: title
  maxWidth: 30
# Album name (ID3v2 TALB)
- id: TALB
  name: album
  maxWidth: 20
# Genre (ID3v2 TCON)
- id: TCON
  name: genre
# Year (ID3v2.3 TYER, tags.json maps year to the ID3v2.4 TDRL frame)
- id: TYER
  name: year

# Music library settings
library:
  # ID3 tag version to use for metadata
  tagId: ID3v2.3
  # Base path for music library scanning
  basePath: "/home/nicholas/Music"
  # Tags that are read, edited, filtered, and displayed - essential for playlists and basic info
  # Only text (T***) and custom (TXXX.*) frames are supported, rating is configured separately
  tags:
  - artist
  - title
  - year
  - genre
  - album
  - album_artist

# View configurations for each output format, tags are displayed in the order listed
# and must be included in library.tags (rating is always available)
views:
  # Table format, used when viewing multiple files
  table:
    headers:
      # Whether to show column headers
      visible: true
      # Whether to capitalize header text
      capitalize: false
    seperators:
      # Whether to show vertical separators between columns
      vertical: false
      # Whether to show horizontal separators between rows
      horizontal: false
    tags:
    - name: rating
    - name: artist
    - name: title
    - name: album
  # List format, used when viewing a single file
  list:
    headers:
      # Whether to show field names in list output
      visible: true
    tags:
    - name: rating
    - name: artist
    - name: album_artist
    - name: title
    - name: album
    - name: genre
    - name: year

# WebSocket server settings for real-time communication
websocket:
  # Port for WebSocket connections
  port: 8999

# HTTP server settings
server:
  # Port for HTTP server
  port: 3000

# Logging configuration
logger:
  # Color schemes for different log levels (hex color codes)
  colors:
    fatal:
      # Foreground color (white)
      fg: '#FFFFFF'
      # Background color (dark red)
      bg: '#E61414'
      # Font styling
      gui: 'italic'
    error:
      fg: '#FFFFFF'
      bg: '#B41414'
      gui: 'normal'
    warn:
      fg: '#FFFFFF'
      bg: '#B43C14'
      gui: 'normal'
    log:
      fg: '#FFFFFF'
      bg: '#3C6EB4'
      gui: 'normal'
    info:
      fg: '#FFFFFF'
      bg: '#143282'
      gui: 'normal'
    debug:
      fg: '#FFFFFF'
      bg: '#5064C8'
      gui: 'normal'
    trace:
      fg: '#FFFFFF'
      bg: '#6496DC'
      gui: 'normal'
  # File logging settings
  file:
    # Log file, relative names are in mpd.baseDirectory
    name: musicman.log
    # Most detailed level written to the log file: error, warn, info, debug, or trace
    level: debug
  # Archive of runs of commands that change something (edit, playlist, sort, db --update or --backup,
  # sync except --review): one <run id>.log and <run id>.json report each, viewed with musicman logs
  archive:
    # Directory for archived runs, defaults to $XDG_STATE_HOME/musicman/logs
    directory:
    # Most detailed level written to the run log: error, warn, info, debug, or trace
    level: debug
    # Number of runs kept for each command, older runs are deleted
    keep: 200

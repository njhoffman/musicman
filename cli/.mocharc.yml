# pnpm test sets NODE_ENV=test; test/setup.js puts expect, assert, should, and sinon on global
require: ./test/setup.js
# the integration tests run first, then every lib spec
file: ./test/integration.js
spec: lib/**/*.spec.js
reporter: spec
color: true
# a hung test fails instead of stalling the run; no retries, so a flaky test shows
timeout: 20000
retries: 0
slow: 75
